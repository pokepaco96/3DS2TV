name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests and APK
        run: ./gradlew --no-daemon :core:test :tools:mock-3ds-sender:test :app:lintDebug :app:assembleDebug

      - name: Prepare files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/3DS2TV-${GITHUB_REF_NAME}-debug.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      # Debug-signed APK: installable via ADB. No signing keys are stored in the repository.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            APK debug de 3DS2TV para Android TV / Chromecast con Google TV.
            Instalación: docs/INSTALL_CHROMECAST.md. Validación física pendiente: docs/HARDWARE_VALIDATION.md.
