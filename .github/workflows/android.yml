name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint y APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit + integration tests (JVM)
        run: ./gradlew --no-daemon :core:test :tools:mock-3ds-sender:test :app:testDebugUnitTest

      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build debug APK, test APK and mock sender
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :tools:mock-3ds-sender:distZip

      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/3DS2TV-${VERSION}-debug-${GITHUB_SHA::7}.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: 3DS2TV-debug-apk
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: mock-3ds-sender
          path: tools/mock-3ds-sender/build/distributions/*.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            core/build/reports/
            tools/mock-3ds-sender/build/reports/
            app/build/reports/

  emulator:
    name: Prueba end-to-end en emulador Android TV
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on Android TV (API 31) emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          arch: x86
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-reports
          path: app/build/reports/androidTests/
